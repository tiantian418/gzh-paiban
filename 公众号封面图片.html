<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一字澄心 · 公众号封面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #e8e0d8;
      padding: 20px;
      gap: 30px;
      font-family: '华文楷体', 'KaiTi', 'STKaiti', serif;
    }

    .cover {
      width: 900px;
      height: 383px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
      background-image: url('https://plus.unsplash.com/premium_photo-1728072616748-2b1abbcca2c5?w=900&h=383&fit=crop&crop=center');
      background-size: cover;
      background-position: center;
    }

    /* ===== 深色半透明遮罩 ===== */
    .cover::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(20, 18, 16, 0.55);
      z-index: 0;
      border-radius: 12px;
    }

    /* ===== 顶部柔光 ===== */
    .cover::after {
      content: '';
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 450px;
      height: 180px;
      background: radial-gradient(ellipse at 50% 0%, rgba(210, 185, 160, 0.08), transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* ===== 文字容器 ===== */
    .main-quote {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      /* 上移，避开人物头部 */
      margin-top: -48px;
      width: 82%;
      max-width: 720px;
      text-align: center;
      z-index: 2;
      user-select: none;
      padding: 10px 0;
    }

    .main-quote p {
      font-size: 60px;
      font-weight: 700;
      color: #ece4d9;
      text-shadow: 0 2px 30px rgba(0, 0, 0, 0.5);
      letter-spacing: 2px;
      line-height: 1.6;
      font-family: '华文楷体', 'KaiTi', 'STKaiti', serif;
      margin: 0;
    }

    /* ===== logo：改成无衬线，缩小减淡 ===== */
    .logo-seal {
      position: absolute;
      bottom: 28px;
      left: 30px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      user-select: none;
      opacity: 0.55;
    }

    .logo-seal .seal-char {
      font-family: 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
      font-size: 12px;
      font-weight: 400;
      color: #ece4d9;
      letter-spacing: 4px;
      line-height: 1.4;
    }

    /* ===== 下载按钮 ===== */
    .save-btn {
      padding: 14px 48px;
      font-size: 17px;
      font-family: '华文楷体', 'KaiTi', serif;
      background: #3d3530;
      color: #ece4d9;
      border: 1px solid rgba(200, 180, 160, 0.10);
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      letter-spacing: 4px;
      transition: all 0.3s ease;
    }

    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      background: #4a423a;
    }

    .save-btn:active {
      transform: scale(0.96);
    }

    .save-btn .icon {
      margin-right: 10px;
    }

    .status-msg {
      font-size: 14px;
      color: rgba(100, 90, 80, 0.4);
      letter-spacing: 2px;
      font-family: 'Georgia', serif;
      min-height: 24px;
      transition: all 0.3s ease;
    }

    .status-msg.success {
      color: #4a7a5a;
    }

    .hint-text {
      font-size: 13px;
      color: rgba(100, 90, 80, 0.3);
      letter-spacing: 2px;
      font-family: 'Georgia', serif;
      text-align: center;
      max-width: 600px;
      line-height: 1.8;
    }

    .hint-text code {
      background: rgba(0, 0, 0, 0.04);
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 12px;
      color: #5a4a3a;
    }
  </style>
</head>

<body>

  <div class="cover" id="cover">
    <!-- 主标题 -->
    <div class="main-quote">
      <p>我想请长假</p>
    </div>
    <!-- logo -->
    <div class="logo-seal">
      <span class="seal-char">一</span>
      <span class="seal-char">字</span>
      <span class="seal-char">澄</span>
      <span class="seal-char">心</span>
    </div>
  </div>

  <button class="save-btn" id="saveBtn">
    <span class="icon">⬇</span> 下载封面图
  </button>
  <div class="status-msg" id="statusMsg">点击即可保存 900×383 高清 PNG</div>

  <script>
    (function () {
      const cover = document.getElementById('cover');
      const saveBtn = document.getElementById('saveBtn');
      const statusMsg = document.getElementById('statusMsg');

      function loadHtml2Canvas() {
        return new Promise((resolve, reject) => {
          if (typeof html2canvas !== 'undefined') {
            resolve(html2canvas);
            return;
          }
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
          script.onload = () => {
            if (typeof html2canvas !== 'undefined') {
              resolve(html2canvas);
            } else {
              reject(new Error('html2canvas 加载失败'));
            }
          };
          script.onerror = () => reject(new Error('html2canvas CDN 加载失败'));
          document.head.appendChild(script);
        });
      }

      function downloadCover() {
        statusMsg.textContent = '⏳ 正在生成...';
        statusMsg.className = 'status-msg';

        html2canvas(cover, {
          scale: 3,
          useCORS: true,
          allowTaint: false,
          backgroundColor: '#2b2520',
          width: 900,
          height: 383,
          logging: false,
        }).then((canvas) => {
          const link = document.createElement('a');
          const title = document.querySelector('.main-quote p').textContent.trim();
          link.download = title + '.png';
          link.href = canvas.toDataURL('image/png');
          link.click();

          statusMsg.textContent = '✅ 已保存！文字完整居中 ✦';
          statusMsg.className = 'status-msg success';

          setTimeout(() => {
            statusMsg.textContent = '点击即可保存 900×383 高清 PNG';
            statusMsg.className = 'status-msg';
          }, 5000);

        }).catch((err) => {
          console.error('截图失败:', err);
          statusMsg.textContent = '❌ 生成失败，请刷新后重试';
          statusMsg.className = 'status-msg';
        });
      }

      saveBtn.addEventListener('click', function () {
        loadHtml2Canvas()
          .then(() => downloadCover())
          .catch((err) => {
            console.error('加载失败:', err);
            statusMsg.textContent = '❌ 加载失败，请检查网络后刷新';
            statusMsg.className = 'status-msg';
          });
      });

      window.addEventListener('load', function () {
        loadHtml2Canvas()
          .then(() => {
            console.log('✅ html2canvas 已就绪');
            statusMsg.textContent = '✨ 已就绪，点击按钮保存封面图';
            statusMsg.className = 'status-msg';
          })
          .catch(() => {
            statusMsg.textContent = '⚠️ 网络波动，请刷新后重试';
            statusMsg.className = 'status-msg';
          });
      });
    })();
  </script>
</body>

</html>
